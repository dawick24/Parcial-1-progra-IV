<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Parque Vehicular</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #c0392b;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(192, 57, 43, 0.7);
    }
    header h1 {
      margin: 0;
      font-weight: 700;
      font-size: 2rem;
      color: #fff;
    }
    main {
      max-width: 480px;
      margin: 50px auto;
      background-color: #222;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(192, 57, 43, 0.6);
    }
    form h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #e74c3c;
      font-weight: 700;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #e74c3c;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      background-color: #333;
      color: #fff;
      box-sizing: border-box;
    }
    input:focus {
      outline: 2px solid #e74c3c;
      background-color: #2c2c2c;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 30px;
      background-color: #e74c3c;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Parque Vehicular</h1>
  </header>
  <main>
    <form id="vehiculoForm">
      <h1>Formulario de Vehículos</h1>

      <label for="marca">Marca:</label>
      <input type="text" id="marca" name="marca" required />

      <label for="modelo">Modelo:</label>
      <input type="text" id="modelo" name="modelo" required />

      <label for="year">Año:</label>
      <input type="number" id="year" name="year" required />

      <label for="num_motor">Número de motor:</label>
      <input type="text" id="num_motor" name="num_motor" required />

      <label for="num_chasis">Número de chasis:</label>
      <input type="text" id="num_chasis" name="num_chasis" required />

      <button type="submit">Guardar</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
