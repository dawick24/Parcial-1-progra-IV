<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Libros y Autores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="app" class="container mt-5">
        <h1 class="text-center mb-4">Gestión de Libros y Autores</h1>

        <!-- Formulario de Autor -->
        <div class="card mb-4">
            <div class="card-header">Registro de Autor</div>
            <div class="card-body">
                <form @submit.prevent="agregarAutor">
                    <div class="mb-3">
                        <label class="form-label">Código:</label>
                        <input v-model="nuevoAutor.codigo" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input v-model="nuevoAutor.nombre" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">País:</label>
                        <input v-model="nuevoAutor.pais" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono:</label>
                        <input v-model="nuevoAutor.telefono" type="text" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Agregar Autor</button>
                </form>
            </div>
        </div>

        <!-- Lista de Autores -->
        <div class="card mb-4">
            <div class="card-header">Lista de Autores</div>
            <ul class="list-group list-group-flush">
                <li v-for="autor in autores" :key="autor.idAutor" class="list-group-item">
                    {{ autor.nombre }} - {{ autor.pais }}
                    <button @click="eliminarAutor(autor.idAutor)" class="btn btn-danger btn-sm float-end">Eliminar</button>
                </li>
            </ul>
        </div>

        <!-- Formulario de Libro -->
        <div class="card mb-4">
            <div class="card-header">Registro de Libro</div>
            <div class="card-body">
                <form @submit.prevent="agregarLibro">
                    <div class="mb-3">
                        <label class="form-label">Autor:</label>
                        <select v-model="nuevoLibro.idAutor" class="form-select" required>
                            <option v-for="autor in autores" :key="autor.idAutor" :value="autor.idAutor">
                                {{ autor.nombre }}
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ISBN:</label>
                        <input v-model="nuevoLibro.isbn" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Título:</label>
                        <input v-model="nuevoLibro.titulo" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Editorial:</label>
                        <input v-model="nuevoLibro.editorial" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Edición:</label>
                        <input v-model="nuevoLibro.edicion" type="text" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Agregar Libro</button>
                </form>
            </div>
        </div>

        <!-- Lista de Libros -->
        <div class="card mb-4">
            <div class="card-header">Lista de Libros</div>
            <ul class="list-group list-group-flush">
                <li v-for="libro in libros" :key="libro.idLibro" class="list-group-item">
                    {{ libro.titulo }} - {{ libro.isbn }}
                    <button @click="eliminarLibro(libro.idLibro)" class="btn btn-danger btn-sm float-end">Eliminar</button>
                </li>
            </ul>
        </div>

    </div>

    <!-- Toast de Notificación -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastEliminar" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notificación</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                ¡Eliminado correctamente!
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
    <script src="https://unpkg.com/dexie@3.2.2/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
